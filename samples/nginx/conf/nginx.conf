# Nginx configuration for single-process operation on Unikraft.
# The unikernel runs one vCPU and one virtio-net queue pair. Nginx must not
# fork: the ELF loader supports one process tree, and there is no
# process supervisor in the unikernel.

worker_processes 1;
master_process off;
daemon off;

# Write errors to the serial console. The unikernel has no log daemon.
error_log stderr warn;
pid /run/nginx.pid;

events {
    use epoll;
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The lwIP socket layer has no sendfile path. Nginx copies the
    # file through user space instead.
    sendfile off;

    access_log off;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
